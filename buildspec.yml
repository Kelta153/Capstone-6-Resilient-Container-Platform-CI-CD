version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

  build:
    commands:
      - echo Building web Docker image...
      - docker build -t "$WEB_REPOSITORY_URI:latest" ./app/web

      - echo Building worker Docker image...
      - docker build -t "$WORKER_REPOSITORY_URI:latest" ./app/worker

  post_build:
    commands:
      - echo Pushing web image to ECR...
      - docker push "$WEB_REPOSITORY_URI:latest"

      - echo Pushing worker image to ECR...
      - docker push "$WORKER_REPOSITORY_URI:latest"

      - echo Updating web ECS service...
      - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WEB_SERVICE" --force-new-deployment

      - echo Updating worker ECS service...
      - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WORKER_SERVICE" --force-new-deployment

      - echo CI/CD deployment completed successfully.

artifacts:
  files:
    - "**/*"
