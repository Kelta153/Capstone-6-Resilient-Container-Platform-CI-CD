version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci --prefix app/web
      - npm ci --prefix app/worker
      - npm ci --prefix infrastructure

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - AWS_REGION=${AWS_DEFAULT_REGION}
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

  build:
    commands:
      - echo Building web image...
      - docker build -t resilient-platform-web ./app/web
      - docker tag resilient-platform-web:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/resilient-platform-web:latest

      - echo Building worker image...
      - docker build -t resilient-platform-worker ./app/worker
      - docker tag resilient-platform-worker:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/resilient-platform-worker:latest

      - echo Pushing images to ECR...
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/resilient-platform-web:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/resilient-platform-worker:latest

      - echo Building infrastructure...
      - npm run build --prefix infrastructure
      - cd infrastructure && npx cdk synth

artifacts:
  files:
    - infrastructure/cdk.out/**/*
